manual:{name:"Manual Load",max:6,hero:"Your business may be losing capacity to manual work.",whyHeadline:"Some of the work may exist because the process was built that way.",why:"Your responses suggest that repetitive administration, information movement or rework may be consuming capacity that could otherwise be used for higher-value work. The issue is not necessarily that the work is difficult. It is that some of it may not need to be done in its current form.",meaning:"Manual work becomes an operational constraint when people repeatedly move, check, reconcile or recreate information.",question:"How much of the work your team performs is necessary, and how much exists because the process works this way?",investigation:["Repetitive data entry and re-entry","Spreadsheet and system handoffs","Duplicate reporting or administration","Rework caused by incomplete or changing information"]},

ected to decisions.","automation|manual":"Manual work may point to automation opportunities, but only once the process is consistent enough to automate.","automation|coordination":"Automation may reduce handoffs, but unclear ownership and decision points need to be addressed first.","automation|scaling":"Automation can help decouple workload growth from operational effort once the right processes have been identified.","automation|visibility":"Automation will only improve visibility if the underlying information is consistent, trusted and connected to decisions."};
